  <!-- Success page (client-side redirect target after checkout) - keep this file separate as success.html (see below) -->

  <!-- Client-side JS: upload + create Checkout Session -->
  <script>
    (function () {
      // IMPORTANT: set this to your server domain (no trailing slash)
      // Your server must implement POST /upload and POST /create-checkout-session
      // Do NOT put Stripe secret key here.
      const API_BASE = "https://YOUR-SERVER-DOMAIN.com";

      const uploadForm = document.getElementById('upload-form');
      const fileInput = document.getElementById('file-input');
      const payButton = document.getElementById('pay-button');
      const statusEl = document.getElementById('upload-status');

      uploadForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!fileInput.files.length) {
          alert('Selecione um arquivo PDF para converter.');
          return;
        }

        payButton.disabled = true;
        statusEl.textContent = 'Fazendo upload do arquivo...';

        try {
          const file = fileInput.files[0];
          const fd = new FormData();
          fd.append('file', file);

          const uploadResp = await fetch(`${API_BASE}/upload`, {
            method: 'POST',
            body: fd
          });

          if (!uploadResp.ok) {
            const txt = await uploadResp.text();
            throw new Error('Erro no upload: ' + txt);
          }
          const uploadData = await uploadResp.json();
          const fileId = uploadData.fileId;
          if (!fileId) throw new Error('Resposta do servidor inválida (fileId ausente)');

          statusEl.textContent = 'Criando sessão de pagamento...';

          // Create checkout session on server (server uses STRIPE_SECRET_KEY)
          const sessionResp = await fetch(`${API_BASE}/create-checkout-session`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'omit',
            body: JSON.stringify({ fileId })
          });

          if (!sessionResp.ok) {
            const txt = await sessionResp.text();
            throw new Error('Erro criando sessão: ' + txt);
          }

          const sessionData = await sessionResp.json();

          // server should return { url: 'https://checkout.stripe.com/...' }
          if (sessionData.url) {
            // redirect to Stripe Checkout
            window.location.href = sessionData.url;
          } else if (sessionData.id && sessionData.checkoutUrl) {
            window.location.href = sessionData.checkoutUrl;
          } else {
            throw new Error('Dados da sessão inválidos');
          }
        } catch (err) {
          console.error(err);
          statusEl.textContent = 'Erro: ' + (err.message || err);
          payButton.disabled = false;
        }
      });

      // Optional: show simple file size/name preview
      fileInput.addEventListener('change', () => {
        if (fileInput.files.length) {
          const f = fileInput.files[0];
          statusEl.textContent = `Arquivo selecionado: ${f.name} (${Math.round(f.size / 1024)} KB)`;
        } else {
          statusEl.textContent = '';
        }
      });
    })();
  </script>
